# Sonar analysis configuration for Feature5PQRS
# Set the project key and organization if required by your Sonar instance
sonar.projectKey=EP05P2F5:citasalud-f5-backend
# sonar.organization=your-org-if-on-sonarcloud
# sonar.host.url=http://your-sonar-server
# sonar.login=<token-if-required>

# Use JaCoCo XML report (generate it locally with `mvn test jacoco:report`)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Coverage exclusions: files/patterns we want Sonar to ignore for coverage
# Adjust these patterns to match generated or unimportant code (mappers, DTOs, entities, config, initializers)
sonar.coverage.exclusions=**/*MapperImpl.java,**/config/DataInitializer.java,**/DTO/**,**/entities/**,**/*Application.java,**/*Config*.java

# If you prefer different general file exclusions (not only coverage), use:
# sonar.exclusions=**/generated-sources/**,**/*MapperImpl.java

# (Optional) Exclude tests from analysis (Sonar normally ignores test sources for coverage)
# sonar.tests=src/test/java

# Encoding
sonar.sourceEncoding=UTF-8
