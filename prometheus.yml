global:
  scrape_interval: 15s # Cada 15 segundos recolecta métricas
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080'] # Tu app Spring Boot
        labels:
          application: 'citasalud-pqrs'
          environment: 'local'
