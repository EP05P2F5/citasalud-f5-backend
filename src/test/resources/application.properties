spring.profiles.active=test
# --- DataSource en memoria para tests ---
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# --- JWT para tests ---
jwt.secret=test-secret-please-change-32bytes-minimum-0123456789abcd
jwt.expiration=600000

# --- Logging bajo en tests ---
logging.level.org.springframework=ERROR
logging.level.com.feature5.pqrs=DEBUG

