# =========================================================
# APLICACION PRINCIPAL
# =========================================================
spring.application.name=Feature5PQRS

# =========================================================
# IMPORTAR VARIABLES .ENV
# =========================================================
spring.config.import=optional:file:.env[.properties]

# =========================================================
# BASE DE DATOS SUPABASE (PUERTO DIRECTO, NO POOLER)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-east-2.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Evitar chequeos innecesarios de metadatos (Supabase falla a veces con JDBC metadata)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# =========================================================
# HIKARI POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=false

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# =========================================================
# JWT CONFIG
# =========================================================
jwt.secret=${JWT_SECRET:feature5pqrsfabricaescuelaudea2025123456789}
jwt.expiration=3600000

# =========================================================
# ADMIN USER (SOLO PARA DESARROLLO)
# =========================================================
# Credenciales leidas desde variables de entorno (.env)
# Configurar en archivo .env:

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.security=DEBUG
logging.level.com.feature5.pqrs=DEBUG
