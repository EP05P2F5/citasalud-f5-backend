apiVersion: v1
kind: Secret
metadata:
  name: pqrs-secret
  namespace: citasalud
type: Opaque
stringData:
  # IMPORTANTE: En producción, estos valores deben ser codificados en base64
  # y nunca deben estar en el repositorio. Usa sealed-secrets o external-secrets.
  
  # Database credentials
  DB_USER: "postgres"
  DB_PASSWORD: "CAMBIAR_EN_PRODUCCION"
  
  # JWT Secret (debe ser una cadena segura y aleatoria)
  JWT_SECRET: "feature5pqrsfabricaescuelaudea2025123456789"
  
  # Admin user credentials
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "admin123"
---
# Para generar secrets en base64:
# echo -n 'tu-valor' | base64
# 
# Ejemplo:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: pqrs-secret
#   namespace: citasalud
# type: Opaque
# data:
#   DB_USER: cG9zdGdyZXM=
#   DB_PASSWORD: Q0FNQklBUl9FTl9QUk9EVUNDSU9O
