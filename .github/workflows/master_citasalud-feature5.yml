name: CI/CD Pipeline - Quality, Coverage, Deployment, Docker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  # =========================================================
  #  1. SONARCLOUD ANALYSIS AND QUALITY CHECK
  # =========================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    env:
      ADMIN_USERNAME: test_admin
      ADMIN_PASSWORD: test_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build project
        run: mvn -B clean install

      - name: Run tests with coverage for SonarCloud
        run: mvn clean test jacoco:report

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

      - name: Run SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=EP05P2F5_citasalud-f5-backend \
            -Dsonar.organization=ep05p2f51 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml


  # =========================================================
  #  2. COVERAGE REPORT (JaCoCo)
  # =========================================================
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: sonarcloud  # Solo se ejecuta si el análisis pasa

    env:
      ADMIN_USERNAME: test_admin
      ADMIN_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn clean test jacoco:report

      - name: Generate JaCoCo report
        run: mvn jacoco:report

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/


  # =========================================================
  #  3. BUILD AND DEPLOY TO AZURE
  # =========================================================
  build-deploy-azure:
    name: Build and Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: [sonarcloud, coverage]  # Solo se ejecuta si los anteriores pasan
    permissions:
      contents: read
      id-token: write

    env:
      ADMIN_USERNAME: test_admin
      ADMIN_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven (skip tests)
        run: mvn clean install -DskipTests

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BD1F808BCAF940AFBDB85580624283A5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A524B912B508488082AF3215225A4183 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C79D4330360E409A9E1E039132CA66DD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'citasalud-feature5'
          slot-name: 'Production'
          package: '*.jar'
