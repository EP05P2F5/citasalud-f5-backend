name: Quality Check

on:
  push:
    branches: [ master, develop, arquisoft ]
  pull_request:
    branches: [ master, develop, arquisoft ]

jobs:
  # Job para análisis de SonarCloud (solo en push)
  sonarcloud:
    name: SonarCloud Analysis
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Cache SonarCloud packages
      uses: actions/cache@v3
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run tests with coverage for SonarCloud
      run: mvn clean test jacoco:report
        
    - name: Run SonarCloud analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=EP05P2F5_citasalud-f5-backend \
          -Dsonar.organization=ep05p2f51 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # Job para reporte de JaCoCo (solo en PRs)
  jacoco:
    name: JaCoCo Coverage Report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write  # Para publicar check results
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven  # Esto ya maneja el caché automáticamente
        
    - name: Run tests with JaCoCo coverage
      run: mvn clean test jacoco:report
      
    - name: Check if JaCoCo report exists
      id: jacoco-check
      run: |
        if [ -f "target/site/jacoco/jacoco.xml" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ JaCoCo report not found"
        fi
        
    - name: Upload JaCoCo coverage report
      if: steps.jacoco-check.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/
        retention-days: 30  # Opcional: limitar retención
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 30
        
    - name: Add coverage comment to PR
      if: steps.jacoco-check.outputs.exists == 'true'
      uses: madrapps/jacoco-report@v1.7.2
      with:
        paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 80
        min-coverage-changed-files: 80
        title: 'Code Coverage Report'
        update-comment: true  # Actualiza el mismo comentario en lugar de crear nuevos
